version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: haskell-api-postgres
    environment:
      POSTGRES_DB: haskell_api
      POSTGRES_USER: haskell_user
      POSTGRES_PASSWORD: haskell_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haskell_user -d haskell_api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
