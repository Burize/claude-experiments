name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10.2.0'

      - name: Cache Cabal packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', '**/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Update Cabal package list
        run: cabal update

      - name: Install dependencies
        run: cabal build --only-dependencies --enable-tests

      - name: Build project
        run: cabal build

      - name: Start PostgreSQL with Docker Compose
        run: docker-compose up -d

      - name: Wait for PostgreSQL to be ready
        run: |
          timeout 60 bash -c 'until docker exec haskell-api-postgres pg_isready -U haskell_user -d haskell_api; do sleep 2; done'

      - name: Run tests
        run: cabal test --test-show-details=direct

      - name: Stop PostgreSQL
        if: always()
        run: docker-compose down -v
